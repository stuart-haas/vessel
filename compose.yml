services:
  server:
    build:
      context: ./server
    environment:
      VESSEL_CORS_ORIGINS: "*"
      # Persist the SQLite DB on a named volume.
      VESSEL_DATABASE_URL: "sqlite:////data/vessel.db"
    volumes:
      - server_data:/data
    ports:
      - "3000:3000"

volumes:
  server_data:
